name: Daily automation

on:
  push:
    paths:
      - "data/board.json"
  schedule:
    - cron: "54 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run daily task
        run: python scripts/daily_update.py
      - name: Commit if changed
        run: |
          git config user.name "grahamdeno"
          git config user.email "grahamdeno@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: daily update"
          git push
